    <h1 style="font-weight: 500;">✬ご入信を誓われる方へ</h1>
    <h2>我々はあなた達を歓迎します。<br>
入信する方は還約式をするため、聖華神永零虚教公式インスタグラムにDMしてください。本部の者が対応いたします。<br>
また、代表者が一名いればご友人の分も代わりに還約宣誓をすることもできます。お忙しい方でも御友人と共に救われましょう。<br>
なお、入信料はありませんが脱会金は10万円となっております。<br>
年会費は18歳以上の方は5万円、50歳以上の方は7万円、70歳以上の方は10万円となっております。また、18歳以下の方は年会費を徴収いたしません。</h2>
